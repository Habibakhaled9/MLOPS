services:

  redis:
    image: redis:8.10.3-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5  
  api:
    build: 
      context: .
    image: llm-question-api:1.0
    ports:
      - "8000:8000"
    environment:
      
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
      DATABASE_URL: postgresql+asyncpg://app_user:${POSTGRES_PASSWORD}@db:5432/app_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
       condition: service_healthy
      
      db:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_logs:
  postgres_data:
  redis_data: